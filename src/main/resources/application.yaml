spring:
  application:
    name: "${APPLICATION_NAME:oficina-mecanica-api}"
  datasource:
    url: ${DATASOURCE_HOST:jdbc:postgresql://localhost}:${DATASOURCE_PORT:5432}/${DATASOURCE_NAME:oficina}
    username: ${DATASOURCE_USERNAME:}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

server:
  port: ${CLINIC_MANAGEMENT_PORT:8081}
  servlet:
    context-path: "/${APPLICATION_PREFIX:api/v1}"
  error.include-stacktrace: never

log:
  file:
    path: "${LOG_PATH:/tmp/logs}"

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: oficina-mecanica-api

logging:
  level:
    feign.client: DEBUG

# Linha 1 — adicionar $ antes da chave
api:
  secret: "${API_SECRET}"

# Linha 2 — remover o espaço
springdoc:
  swagger-ui:
    path: /documentation
  api-docs:
    path: /api-docs-personalized