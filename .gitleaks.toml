# Regras do Gitleaks do projeto (CI: job "segredos"). As regras padrão não reconhecem segredo Base64 genérico,
# por isso a regra extra para o API_SECRET. Ver docs/seguranca/relatorio-vulnerabilidades.md.
[extend]
useDefault = true

[[rules]]
id = "oficina-jwt-secret"
description = "Segredo JWT (API_SECRET / api.secret) em Base64 versionado"
regex = '''(?i)(?:API_SECRET|api[._-]?secret|secret)["']?\s*[:=]\s*["']?([A-Za-z0-9+/]{40,}={0,2})'''
secretGroup = 1
