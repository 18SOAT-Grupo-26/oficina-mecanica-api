# SonarQube local para analisar o código antes de abrir o PR.
# Separado do docker-compose.yml da aplicação: sobe só quando chamado explicitamente.
#   docker compose -f docker-compose.sonar.yml up -d
services:
  sonarqube:
    image: sonarqube:26.9.0.129388-community
    container_name: oficina-mecanica-sonarqube
    ports:
      - "9000:9000"
    environment:
      # ambiente local: dispensa o ajuste de vm.max_map_count exigido pelo Elasticsearch embutido
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
