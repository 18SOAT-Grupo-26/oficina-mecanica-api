        description: 'Página, a partir de 1 (padrão: 1)'
        required: false
        schema:
          type: integer
          format: int32
      - name: tamanho
        in: query
        description: 'Itens por página (padrão: 20, máximo: 100)'
        required: false
        schema:
          type: integer
          format: int32
      responses:
