              schema:
                "$ref": "#/components/schemas/ErrorTemplate"
        '422':
          description: Status desconhecido ou body ilegível
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorTemplate"
        '500':
          description: Erro interno inesperado
