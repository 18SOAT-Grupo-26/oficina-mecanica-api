  "/ordens-servico/{id}":
    get:
      tags:
      - Ordem de Serviço
      summary: Consultar OS
      description: Status, itens e histórico.
      operationId: consultar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OS encontrada
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/OrdemServicoResponse"
        '401':
          description: Token ausente ou inválido
        '403':
          description: Usuário sem perfil autorizado para esta operação
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorTemplate"
        '404':
          description: OS não encontrada
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorTemplate"
        '500':
          description: Erro interno inesperado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorTemplate"
      security:
      - bearerAuth: []
    put:
      tags:
      - Ordem de Serviço
      summary: Atualizar dados da OS
      description: |-
        Atualização completa, com o mesmo body da criação: cliente, veículo, serviços e peças são obrigatórios.
        Lista vazia remove os itens daquele tipo; dado igual ao atual não conta como alteração.
        A partir de EM_EXECUCAO (e com a OS cancelada) nada pode ser editado.
        Cliente e veículo precisam ser os da abertura (outro responde 409: cancele a OS e abra outra).
        Itens só mudam em EM_DIAGNOSTICO. O status não muda por aqui.
      operationId: atualizar_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/OrdemServicoRequest"
        required: true
      responses:
        '200':
          description: OS atualizada
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/OrdemServicoResponse"
        '400':
          description: Cliente, veículo, serviços ou peças ausentes, ou campos inválidos
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorTemplate"
        '401':
          description: Token ausente ou inválido
        '403':
          description: Usuário sem perfil autorizado para esta operação
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorTemplate"
        '404':
          description: OS ou cadastro não encontrado
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorTemplate"
        '409':
          description: OS em EM_EXECUCAO ou depois, cliente ou veículo diferente,
            itens fora de EM_DIAGNOSTICO, item repetido ou saldo insuficiente
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorTemplate"
        '422':
          description: Body ausente ou ilegível
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorTemplate"
        '500':
          description: Erro interno inesperado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorTemplate"
      security:
      - bearerAuth: []
    delete:
      tags:
      - Ordem de Serviço
      summary: Remover OS (soft delete)
      description: 'Cancela a OS sem removê-la: ela vai para CANCELADA e fica no histórico.
        Com o orçamento pendente (AGUARDANDO_APROVACAO), a reserva de estoque das
        peças é liberada. Só vale até AGUARDANDO_APROVACAO.'
      operationId: cancelar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: OS cancelada
        '401':
          description: Token ausente ou inválido
        '403':
          description: Usuário sem perfil autorizado para esta operação
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorTemplate"
        '404':
          description: OS não encontrada
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorTemplate"
        '409':
          description: OS a partir de EM_EXECUCAO ou já cancelada
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorTemplate"
        '500':
          description: Erro interno inesperado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorTemplate"
      security:
      - bearerAuth: []
