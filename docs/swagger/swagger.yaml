components:
  schemas:
    VeiculoRequest:
      type: object
      properties:
        placa:
          type: string
          minLength: 1
        marca:
          type: string
          minLength: 1
        modelo:
          type: string
          minLength: 1
        ano:
          type: integer
          format: int32
        clienteId:
          type: integer
          format: int64
      required:
      - ano
      - clienteId
      - marca
      - modelo
      - placa
    VeiculoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        placa:
          type: string
        marca:
          type: string
        modelo:
          type: string
        ano:
          type: integer
          format: int32
        clienteId:
          type: integer
          format: int64
        criadoEm:
          type: string
          format: date-time
        atualizadoEm:
          type: string
          format: date-time
    ErrorTemplate:
      type: object
      properties:
        errorCode:
          type: integer
          format: int32
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
    ServicoRequest:
      type: object
      properties:
        nome:
          type: string
        descricao:
          type: string
        preco:
          type: number
    ServicoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        descricao:
          type: string
        preco:
          type: number
        criadoEm:
          type: string
          format: date-time
        atualizadoEm:
          type: string
          format: date-time
    PecaInsumoRequest:
      type: object
      properties:
        nome:
          type: string
        descricao:
          type: string
        quantidade:
          type: integer
          format: int32
        reservado:
          type: integer
          format: int32
