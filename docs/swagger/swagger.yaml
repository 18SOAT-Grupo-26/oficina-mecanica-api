        '200':
          description: Página de OS (vazia quando nenhuma atende aos filtros)
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/PaginaOrdemServicoResponse"
        '400':
          description: Status desconhecido ou parâmetro inválido
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorTemplate"
        '401':
          description: Token ausente ou inválido
        '403':
          description: Usuário sem perfil autorizado para esta operação
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorTemplate"
        '500':
          description: Erro interno inesperado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorTemplate"
      security:
      - bearerAuth: []
    post:
      tags:
      - Ordem de Serviço
      summary: Criar OS
      description: Toda OS nasce RECEBIDA e vai sozinha para EM_DIAGNOSTICO (os dois
        ficam no histórico). Cliente (CPF/CNPJ), veículo, serviços e peças são obrigatórios;
        as listas de itens podem vir vazias. Todos devem estar cadastrados, e o preço
        do item fica congelado. Cliente e veículo não mudam depois.
      operationId: criar_3
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/OrdemServicoRequest"
        required: true
      responses:
        '201':
          description: OS criada
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/OrdemServicoResponse"
        '400':
          description: Cliente, veículo, serviços ou peças ausentes, ou campos inválidos
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorTemplate"
        '401':
          description: Token ausente ou inválido
        '403':
          description: Usuário sem perfil autorizado para esta operação
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorTemplate"
        '404':
          description: Cliente, veículo, serviço ou peça não cadastrado
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorTemplate"
        '409':
          description: Veículo de outro cliente, item repetido ou saldo insuficiente
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorTemplate"
        '422':
          description: Body ausente ou ilegível
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorTemplate"
        '500':
          description: Erro interno inesperado
          content:
