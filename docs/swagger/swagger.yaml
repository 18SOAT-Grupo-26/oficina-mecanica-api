  "/ordens-servico/{id}/status":
    patch:
      tags:
      - Ordem de Serviço
      summary: Mudar status da OS
      description: |-
        Só avança para o próximo status: não volta, não pula e não repete o atual.
        Manuais: FINALIZADA e ENTREGUE.
        CANCELADA cancela a OS sem removê-la: só até AGUARDANDO_APROVACAO.
        EM_DIAGNOSTICO vem da abertura da OS; AGUARDANDO_APROVACAO e EM_EXECUCAO, do envio e da aprovação do orçamento.
      operationId: alterarStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Status"
        required: true
      responses:
        '200':
          description: Status alterado
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/OrdemServicoResponse"
        '400':
          description: Status de destino ausente
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorTemplate"
        '401':
          description: Token ausente ou inválido
        '403':
          description: Usuário sem perfil autorizado para esta operação
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorTemplate"
        '404':
          description: OS não encontrada
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorTemplate"
