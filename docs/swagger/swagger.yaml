      operationId: desativar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Veículo desativado
        '401':
          description: Token ausente ou inválido
        '403':
          description: Usuário sem perfil autorizado para esta operação
