  "/ordens-servico":
    get:
      tags:
      - Ordem de Serviço
      summary: Listar OS
      description: Da mais nova para a mais antiga, com status, itens e histórico.
        Cliente e status são filtros opcionais; sem filtro, vêm todas, inclusive as
        canceladas.
      operationId: listar_3
      parameters:
      - name: clienteId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - RECEBIDA
          - EM_DIAGNOSTICO
          - AGUARDANDO_APROVACAO
          - EM_EXECUCAO
          - FINALIZADA
          - ENTREGUE
          - CANCELADA
      - name: pagina
        in: query
        description: 'Página, a partir de 1 (padrão: 1)'
        required: false
        schema:
          type: integer
          format: int32
