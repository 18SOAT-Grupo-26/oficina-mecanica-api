name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    name: Build, testes e SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o Sonar usa o histórico para blame e código novo

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build, testes e cobertura (JaCoCo)
        run: mvn -B verify

      # PRs de fork e repositórios sem o secret pulam a análise, mas mantêm build e testes
      - name: Análise SonarCloud
        if: env.SONAR_TOKEN != ''
        run: >
          mvn -B sonar:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=18soat-grupo-26
