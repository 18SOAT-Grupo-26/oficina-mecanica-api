services:
  db:
    image: postgres:18-alpine
    container_name: oficina-mecanica-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: oficina
      POSTGRES_USER: ${DATASOURCE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD:-postgres}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      # $$ = variável lida dentro do container (o compose não substitui)
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d oficina" ]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: oficina-mecanica-api
    ports:
      - "${SERVER_PORT:-8081}:8081"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATASOURCE_HOST: jdbc:postgresql://db:5432/oficina
      DATASOURCE_USERNAME: ${DATASOURCE_USERNAME:-postgres}
      DATASOURCE_PASSWORD: ${DATASOURCE_PASSWORD:-postgres}
      API_SECRET: ${API_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
      ADMIN_NOME: ${ADMIN_NOME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_USUARIO: ${ADMIN_USUARIO:-}
      ADMIN_SENHA: ${ADMIN_SENHA:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      DATASOURCE_POOL_SIZE: ${DATASOURCE_POOL_SIZE:-10}
      DATASOURCE_CONNECTION_TIMEOUT_MS: ${DATASOURCE_CONNECTION_TIMEOUT_MS:-5000}
      DATASOURCE_QUERY_TIMEOUT_MS: ${DATASOURCE_QUERY_TIMEOUT_MS:-5000}
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8081/api/v1/actuator/health || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s

  sonarqube:
    image: sonarqube:26.9.0.129388-community
    container_name: oficina-mecanica-sonarqube
    ports:
      - "9000:9000"
    environment:
      # ambiente local: dispensa o ajuste de vm.max_map_count exigido pelo Elasticsearch embutido
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: oficina-mecanica-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/regras-sinais-ouro.yaml:/etc/prometheus/regras-sinais-ouro.yaml:ro
      - ./prometheus/alertas.yaml:/etc/prometheus/alertas.yaml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      # no Linux, faz host.docker.internal apontar para a máquina (no Docker Desktop já funciona)
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:13.2.4
    container_name: oficina-mecanica-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # abre direto no dashboard da API
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/json/oficina-mecanica-api.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  prometheus_data:
  grafana_data:
